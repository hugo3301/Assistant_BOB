lete=&quot;off&quot; maxlength=&quot;128&quot; required&gt;&lt;button&gt;Найти мои календари&lt;/button&gt;&lt;/fieldset&gt;&lt;/form&gt;&lt;footer&gt;Личное подключение. Ключи не отправляются в Telegram-чат или модель ИИ.&lt;/footer&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;" sandbox></iframe></section><section><h2>Выбор календаря</h2><iframe title="Выбор календаря" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ru&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;meta name=&quot;color-scheme&quot; content=&quot;dark light&quot;&gt;&lt;title&gt;Выбери календарь · BOB&lt;/title&gt;&lt;style&gt;:root{font:16px/1.5 system-ui,sans-serif;color:#e8edf6;background:#101722;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px 16px}main{max-width:520px;margin:3vh auto}header{color:#96a8c2;font-weight:700;letter-spacing:.12em;font-size:13px}h1{font-size:28px;line-height:1.2;margin:14px 0 20px}p{margin:12px 0;color:#becade}section,form{padding:20px;background:#1b2636;border:1px solid #304159;border-radius:18px;margin:16px 0}label{display:block;font-weight:600;margin:18px 0 6px}input,select,button,.button{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #456084;background:#111c2b;color:#f0f5ff}button,.button{display:block;text-align:center;font-weight:650;text-decoration:none;cursor:pointer;background:#9ddcd4;color:#082421;border:0;margin-top:20px}a{color:#a9ddf1}input[type=checkbox]{width:auto;margin-right:9px}small{display:block;color:#9fadc2;margin-top:8px}footer{font-size:13px;color:#94a4bb;margin:24px 0}.warn{border-left:3px solid #d5b46b;padding-left:12px}.error{color:#ffd1ca}.row{display:flex;align-items:baseline;gap:9px}input:focus,select:focus,button:focus,a:focus{outline:3px solid #84b9e8;outline-offset:3px}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main&gt;&lt;header&gt;BOB · КАЛЕНДАРИ&lt;/header&gt;&lt;h1&gt;Выбери календарь&lt;/h1&gt;&lt;p&gt;Аккаунт подключён. Обмен начнётся после выбора календаря.&lt;/p&gt;&lt;p&gt;Подключаем один выбранный календарь. Встречи и их изменения передаются в обе стороны. Одновременные правки потребуют выбора версии в BOB.&lt;/p&gt;&lt;p&gt;Загрузим встречи на ближайшие 90 дней. Новые встречи BOB отправляются только в календарь по умолчанию. Старые дела, задачи со сроком и импортированное расписание массово не выгружаются. Встреча без длительности займёт в календаре 30 минут.&lt;/p&gt;&lt;p&gt;В альфе обновление — примерно раз в 5 минут. Отключение сохраняет дела в BOB и события в календаре.&lt;/p&gt;&lt;form action=&quot;/calendars/select&quot; method=&quot;post&quot;&gt;&lt;fieldset disabled style=&quot;border:0;padding:0;margin:0;min-width:0&quot;&gt;&lt;input type=&quot;hidden&quot; name=&quot;ticket&quot; value=&quot;synthetic-demo-ticket&quot;&gt;&lt;label for=&quot;calendar&quot;&gt;Календарь&lt;/label&gt;&lt;select id=&quot;calendar&quot; name=&quot;calendar&quot; required&gt;&lt;option value=&quot;0&quot;&gt;Личный календарь&lt;/option&gt;&lt;/select&gt;&lt;label class=&quot;row&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;default&quot; value=&quot;yes&quot; checked&gt;Сюда добавлять новые встречи BOB&lt;/label&gt;&lt;label class=&quot;row&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;consent&quot; value=&quot;yes&quot; required&gt;Включить обмен в обе стороны для выбранного календаря&lt;/label&gt;&lt;button&gt;Включить синхронизацию&lt;/button&gt;&lt;/fieldset&gt;&lt;/form&gt;&lt;footer&gt;Личное подключение. Ключи не отправляются в Telegram-чат или модель ИИ.&lt;/footer&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;" sandbox></iframe></section><section><h2>Готово</h2><iframe title="Готово" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ru&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;meta name=&quot;color-scheme&q
